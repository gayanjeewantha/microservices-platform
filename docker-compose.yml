services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build: ./user-service
    ports:
      - "8080:8080"

  inventory-service:
    build: ./inventory-service
    ports:
      - "8081:8081"

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"

  gateway-service:
    build: ./gateway-service
    ports:
      - "8083:8083"

volumes:
  postgres_data:
